<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全国BOAT RACE一次判定</title><style>body{font-family:system-ui;margin:0;background:#f4f6fa;color:#152c49}header{background:#17375e;color:white;padding:20px}main{padding:15px;max-width:900px;margin:auto}.cards{display:flex;gap:8px}.cards>div{flex:1;background:white;border-radius:10px;padding:12px;text-align:center}.cards strong{display:block;font-size:25px}select{padding:10px;margin:15px 8px 15px 0;font-size:16px}table{border-collapse:collapse;width:100%;background:white;font-size:13px}th,td{padding:10px 6px;border-bottom:1px solid #ddd;text-align:left}.scroll{overflow-x:auto}.muted{color:#65768a}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><header><h2>全国BOAT RACE 一次判定</h2>公式出走表・65点満点</header><main><p id="status">読み込み中…</p><div class="cards"><div>対象R<strong id="total">—</strong></div><div>採点済<strong id="scored">—</strong></div><div>通過<strong id="passed">—</strong></div></div><select id="venue"><option value="">全会場</option></select><select id="filter"><option value="">全判定</option><option>通過</option><option>不通過</option><option>未判定</option></select><div class="scroll"><table><thead><tr><th>会場</th><th>R</th><th>判定</th><th>上位3艇平均</th><th>3-4位差</th><th>取得状況</th></tr></thead><tbody id="rows"><tr><td colspan="6">読み込み中</td></tr></tbody></table></div><details><summary>実行ログ</summary><pre id="log"></pre></details><p class="muted">一次通過は最終推奨度65点以上とは異なります。未取得レースは未判定です。</p></main><script>
let races=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function draw(){let a=races.filter(r=>(!$('venue').value||r['会場']==$('venue').value)&&(!$('filter').value||r['一次通過']==$('filter').value));$('rows').innerHTML=a.length?a.map(r=>`<tr><td>${esc(r['会場'])}</td><td>${esc(r['レース'])}</td><td>${esc(r['一次通過'])}</td><td>${esc(r['上位3艇平均']||'—')}</td><td>${esc(r['3位4位差']||'—')}</td><td>${esc(r['取得'])}</td></tr>`).join(''):'<tr><td colspan="6">表示対象なし。実行ログも確認してください。</td></tr>'}fetch('data.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{races=d.races||[];const s=d.summary;$('status').textContent=`${s.date}｜${s.status}｜更新 ${s.updated_at}`;$('total').textContent=s.races;$('scored').textContent=s.scored;$('passed').textContent=s.passed;$('log').textContent=s.log||'記録なし';[...new Set(races.map(x=>x['会場']))].forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;$('venue').append(o)});draw()}).catch(e=>{$('status').textContent='データ未公開: '+e.message;$('rows').innerHTML='<tr><td colspan="6">初回実行後に表示されます</td></tr>'});$('venue').addEventListener('change',draw);$('filter').addEventListener('change',draw);
</script></html>
